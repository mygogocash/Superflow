# Deploys the Cloudflare edge stack to staging (staging.manut.xyz) on push to
# `preview`. Runs on Depot CI; the Cloud Run staging pipeline was retired
# 2026-09 — this is the only staging deploy.
name: Deploy Edge Staging

on:
  push:
    branches: [preview]
    paths:
      - "apps/edge/**"
      - "apps/edge-jobs/**"
      - "apps/app/**"
      - "packages/db/**"
      - "packages/auth/**"
      - "packages/core/**"
      - "packages/contracts/**"
      - "pnpm-lock.yaml"
      - ".depot/workflows/deploy-edge-staging.yml"
  workflow_dispatch:

concurrency:
  group: deploy-edge-staging
  # Don't cancel a mid-migrate/deploy when a second push lands — leaves Workers half-updated.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Migrate + export + wrangler deploy
    runs-on: depot-ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: ./.depot/actions/setup-workspace
        with:
          turbo-cache-key: deploy-edge-staging

      - name: Require staging secrets
        env:
          STAGING_DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          missing=0
          for name in STAGING_DIRECT_URL CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID BETTER_AUTH_SECRET CRON_SECRET; do
            if [ -z "${!name:-}" ]; then
              echo "::error::${name} is unset in Depot — staging deploy cannot proceed."
              missing=1
            fi
          done
          if [ -n "${CRON_SECRET:-}" ] && [ "${#CRON_SECRET}" -lt 32 ]; then
            echo "::error::CRON_SECRET must be at least 32 characters (Wave 4 fail-closed)."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Required staging secrets present (values not printed)."

      - name: Drizzle migrate (staging)
        env:
          DATABASE_URL: ${{ secrets.STAGING_DIRECT_URL }}
        run: pnpm --filter @nexora/db db:migrate

      - name: Expo web export
        run: pnpm --filter @nexora/app export:web

      - name: Deploy edge Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @nexora/edge deploy:staging

      - name: Deploy edge-jobs Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @nexora/edge-jobs deploy:staging

      # Worker secrets cannot exist until the script is created by wrangler deploy.
      - name: Put edge staging Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_API_KEY: ${{ secrets.BETTER_AUTH_API_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        working-directory: apps/edge
        run: |
          set -euo pipefail
          # Auth cannot work without the signing secret — fail closed.
          if [ -z "${BETTER_AUTH_SECRET:-}" ]; then
            echo "::error::BETTER_AUTH_SECRET unset — refusing to leave staging without auth secret."
            exit 1
          fi
          printf '%s' "$BETTER_AUTH_SECRET" | npx wrangler secret put BETTER_AUTH_SECRET --env staging
          echo "Put BETTER_AUTH_SECRET on intranet-edge-staging."
          if [ -z "${CRON_SECRET:-}" ] || [ "${#CRON_SECRET}" -lt 32 ]; then
            echo "::error::CRON_SECRET unset or shorter than 32 chars — refusing staging cron without a strong secret."
            exit 1
          fi
          printf '%s' "$CRON_SECRET" | npx wrangler secret put CRON_SECRET --env staging
          echo "Put CRON_SECRET on intranet-edge-staging."
          printf '%s' "$CRON_SECRET" | npx wrangler secret put CRON_SECRET --env staging --config ../edge-jobs/wrangler.jsonc
          echo "Put CRON_SECRET on intranet-edge-jobs-staging."
          if [ -n "${BETTER_AUTH_API_KEY:-}" ]; then
            printf '%s' "$BETTER_AUTH_API_KEY" | npx wrangler secret put BETTER_AUTH_API_KEY --env staging
            echo "Put BETTER_AUTH_API_KEY on intranet-edge-staging."
          else
            echo "::notice::BETTER_AUTH_API_KEY unset — Dash plugin stays off (optional)."
          fi
